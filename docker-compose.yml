# Local development services. Run: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: schoolsyncer
      POSTGRES_PASSWORD: schoolsyncer
      POSTGRES_DB: schoolsyncer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
