name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schoolsyncer
          POSTGRES_PASSWORD: schoolsyncer
          POSTGRES_DB: schoolsyncer
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://schoolsyncer:schoolsyncer@localhost:5432/schoolsyncer?schema=public
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter mobile typecheck
      - name: Apply database migrations
        run: pnpm --filter api prisma:deploy
      - run: pnpm --filter api test
      - run: pnpm --filter api test:e2e
      - run: pnpm build
