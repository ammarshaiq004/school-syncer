name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schoolsyncer
          POSTGRES_PASSWORD: schoolsyncer
          POSTGRES_DB: schoolsyncer
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://schoolsyncer:schoolsyncer@localhost:5432/schoolsyncer?schema=public
      JWT_SECRET: ci-only-secret
      # Baked into the web and app bundles; production builds refuse to run without them.
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      EXPO_PUBLIC_API_URL: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        # TODO(SCHOOL-66): make this blocking once the current high advisories
        # are fixed upstream. All are transitive with no compatible fix today:
        # deepmerge-ts <8 via prisma 6 (@prisma/config; fixed only in Prisma 7),
        # node-forge and braces via expo's CLI (no patched release yet).
        continue-on-error: true
        run: pnpm audit --audit-level=high --prod
      - run: pnpm lint
      - run: pnpm --filter mobile typecheck
      - run: pnpm --filter web test
      - name: Apply database migrations
        run: pnpm --filter api prisma:deploy
      - run: pnpm --filter api test
      - run: pnpm --filter api test:e2e
      - run: pnpm build
