name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schoolsyncer
          POSTGRES_PASSWORD: schoolsyncer
          POSTGRES_DB: schoolsyncer
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://schoolsyncer:schoolsyncer@localhost:5432/schoolsyncer?schema=public
      JWT_SECRET: ci-only-secret
      # Baked into the web and app bundles; production builds refuse to run without them.
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      EXPO_PUBLIC_API_URL: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        # TODO(SCHOOL-66): make this blocking once the current high advisories
        # are fixed upstream. All are transitive with no compatible fix today:
        # node-forge and braces via expo's CLI (no patched release yet).
        continue-on-error: true
        run: pnpm audit --audit-level=high --prod
      - run: pnpm lint
      - run: pnpm --filter mobile typecheck
      - run: pnpm --filter mobile test
      - run: pnpm --filter web test
      - name: Apply database migrations
        run: pnpm --filter api prisma:deploy
      - name: Unit tests with the coverage gate
        # Thresholds live in apps/api/vitest.config.ts; the run fails below them.
        run: pnpm --filter api test:cov
      - run: pnpm --filter api test:e2e
      - run: pnpm build

  browser-e2e:
    # SCHOOL-141: the web portal driven in Chromium against the built API.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schoolsyncer
          POSTGRES_PASSWORD: schoolsyncer
          POSTGRES_DB: schoolsyncer
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://schoolsyncer:schoolsyncer@localhost:5432/schoolsyncer?schema=public
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm --filter api prisma:deploy
      - name: Build the API and the web app (pointed at the e2e API on port 4100)
        run: pnpm --filter e2e e2e:build
      - name: Install Chromium
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Run the browser tests
        # Playwright starts the API (4100) and web app (3100) itself, seeds a
        # school through the API and deletes it afterwards.
        run: pnpm --filter e2e e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 14
